name: BFILMY Movie JSON Builder

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours at minute 0 (UTC).
    # 05:30, 07:30, 09:30, ... IST.
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: bfilmy-movie-json-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp ijson

      - name: Run BFILMY builder
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python bfilmy_builder.py \
            --concurrency 80 \
            --parse-workers 3 \
            --queue-depth 24 \
            --flush-files 40 \
            --flush-rows 75000 \
            --push-every 20

      - name: Show git status
        if: always()
        run: |
          git status --short
