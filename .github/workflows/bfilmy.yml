name: BFILMY Movie JSON Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: bfilmy-movie-json-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore BFILMY builder state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/_tmp/state.json
            data/_tmp/bfilmy.sqlite3
            data/_tmp/bfilmy.sqlite3-wal
            data/_tmp/bfilmy.sqlite3-shm
          key: bfilmy-builder-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            bfilmy-builder-${{ runner.os }}-${{ github.ref_name }}-

      - name: Show restored state
        run: |
          echo "=== RESTORED STATE ==="
          if [ -f data/_tmp/state.json ]; then
            echo "state.json FOUND"
          else
            echo "state.json NOT FOUND"
          fi

          if [ -f data/_tmp/bfilmy.sqlite3 ]; then
            echo "SQLite FOUND"
            du -h data/_tmp/bfilmy.sqlite3
          else
            echo "SQLite NOT FOUND"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp ijson uvloop

      - name: Run BFILMY builder
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_ACTIONS: 'true'
        run: |
          if [ -f bfilmy_builder.py ]; then
            BUILDER="bfilmy_builder.py"
          elif [ -f bfilmy_builder_live_checkpoint.py ]; then
            BUILDER="bfilmy_builder_live_checkpoint.py"
          else
            echo "ERROR: BFILMY builder not found"
            exit 1
          fi

          echo "Running: ${BUILDER}"

          python -u "${BUILDER}" \
            --concurrency 80 \
            --parse-workers 3 \
            --queue-depth 24 \
            --flush-files 40 \
            --flush-rows 75000 \
            --push-every 20

      # SAFETY NET:
      # The builder creates files under data/, but file creation alone does
      # NOT put them in GitHub. Explicitly stage, commit and push all generated
      # movie JSONs after the final build.
      # SAFETY NET:
      # Stage ONLY JSON files under data/, never data/_tmp.
      # `git add data -- ':!data/_tmp'` can still fail when Git encounters
      # the ignored _tmp directory, so we explicitly enumerate JSON files.
      - name: Commit and push generated movie JSON
        if: success()
        run: |
          echo "=== GIT SYNC ==="

          # Stage ONLY JSON files. Never stage the huge builder state/SQLite.
          mapfile -d '' JSON_FILES < <(
            find data \
              -type f \
              -name '*.json' \
              ! -path 'data/_tmp/*' \
              -print0
          )

          echo "JSON files present: ${#JSON_FILES[@]}"

          if [ "${#JSON_FILES[@]}" -eq 0 ]; then
            echo "No JSON files found."
            exit 0
          fi

          printf '%s\0' "${JSON_FILES[@]}" | xargs -0 git add --

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          echo "Files to push:"
          git diff --cached --name-only | sed -n '1,120p'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update BFILMY movie JSON data"
          git push

      - name: Save BFILMY builder state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/_tmp/state.json
            data/_tmp/bfilmy.sqlite3
            data/_tmp/bfilmy.sqlite3-wal
            data/_tmp/bfilmy.sqlite3-shm
          key: bfilmy-builder-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Final status
        if: always()
        run: |
          echo "=== FINAL STATUS ==="
          echo "Generated data:"
          find data -maxdepth 2 -type f ! -path 'data/_tmp/*' | wc -l || true
          echo "Git status:"
          git status --short
